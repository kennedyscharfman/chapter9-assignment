<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chapter 9 Assignment</title>

<style>
body {
  font-family: Arial, sans-serif;
}

form {
  background-color: #EAEAEA;
  width: 30em;
  padding: 1.5em;
  margin: 0 auto;
}

label {
  display: block;
  margin-top: 0.75em;
}

fieldset {
  margin-top: 1em;
  width: 26em;
}

h1 {
  text-align: center;
}
</style>

</head>

<body>

<h1>Chapter 9 Assignment</h1>

<form action="https://webdevbasics.net/scripts/demo.php" method="post">

<label for="username">Username:</label>
<input type="text" id="username" name="username">

<fieldset>
<legend>Favorite Day of the Week:</legend>
<input type="radio" name="day" value="Monday"> Monday<br>
<input type="radio" name="day" value="Tuesday"> Tuesday<br>
<input type="radio" name="day" value="Wednesday"> Wednesday<br>
<input type="radio" name="day" value="Thursday"> Thursday<br>
<input type="radio" name="day" value="Friday"> Friday<br>
<input type="radio" name="day" value="Saturday"> Saturday<br>
<input type="radio" name="day" value="Sunday"> Sunday
</fieldset>

<label for="social">Favorite Social Networking Site:</label>
<select id="social" name="social">
  <option value="Instagram">Instagram</option>
  <option value="Twitter">Twitter</option>
  <option value="TikTok">TikTok</option>
  <option value="Snapchat">Snapchat</option>
</select>

<fieldset>
<legend>Shipping Address</legend>

<label for="addr1">Addressline1:</label>
<input type="text" id="addr1" name="addr1">

<label for="addr2">Addressline2:</label>
<input type="text" id="addr2" name="addr2">

<label for="city">City:</label>
<input type="text" id="city" name="city">

<label for="state">State:</label>
<input type="text" id="state" name="state">

<label for="zip">Zip:</label>
<input type="text" id="zip" name="zip">

</fieldset>

<label for="password">Password:</label>
<input type="password" id="password" name="password">

<br><br>

<input type="image" src="signup.gif" alt="Sign Up" width="120">

</form>

</body>
</html>
