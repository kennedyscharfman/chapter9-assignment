<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chapter 9 Assignment</title>

<style>
body {
  font-family: Arial, sans-serif;
}

form {
  background-color: #EAEAEA;
  width: 30em;
  padding: 1.5em;
  margin: 0 auto;
}

label {
  display: block;
  margin-top: 0.75em;
}

fieldset {
  margin-top: 1em;
  width: 26em;
}

h1 {
  text-align: center;
}
</style>

</head>

<body>

<h1>Chapter 9 Assignment</h1>

<form action="musicform.html" method="get">

<label>Username:</label>
<input type="text">

<fieldset>
<legend>Favorite Day of the Week:</legend>
<input type="radio" name="day"> Monday<br>
<input type="radio" name="day"> Tuesday<br>
<input type="radio" name="day"> Wednesday<br>
<input type="radio" name="day"> Thursday<br>
<input type="radio" name="day"> Friday<br>
<input type="radio" name="day"> Saturday<br>
<input type="radio" name="day"> Sunday
</fieldset>

<label>Favorite Social Networking Site:</label>
<select>
  <option>Instagram</option>
  <option>Twitter</option>
  <option>TikTok</option>
  <option>Snapchat</option>
</select>

<fieldset>
<legend>Shipping Address</legend>

<label>Addressline1:</label>
<input type="text">

<label>Addressline2:</label>
<input type="text">

<label>City:</label>
<input type="text">

<label>State:</label>
<input type="text">

<label>Zip:</label>
<input type="text">

</fieldset>

<label>Password:</label>
<input type="password">

<br><br>

<input type="image" src="signup.gif" alt="Sign Up" width="120">

</form>

</body>
</html>
