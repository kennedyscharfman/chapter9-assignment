<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chapter 9 Assignment</title>
<style>
body {
  font-family: Arial, sans-serif;
}

form {
  background-color: #EAEAEA;
  width: 22em;
  padding: 1.5em;
  margin: 0 auto;
}

label {
  display: block;
  margin-top: 0.75em;
}

fieldset {
  margin-top: 1em;
  width: 19em;
}

input[type="image"] {
  display: block;
  margin: 1em auto 0 auto;
}
</style>
</head>

<body>

<h1 style="text-align: center;">Chapter 9 Assignment</h1>

<form>
  <label for="username">Username:</label>
  <input type="text" id="username" name="username">

  <p>Favorite Day of the Week:</p>
  <input type="radio" id="monday" name="day" value="Monday">
  <label for="monday" style="display:inline;">Monday</label><br>

  <input type="radio" id="tuesday" name="day" value="Tuesday">
  <label for="tuesday" style="display:inline;">Tuesday</label><br>

  <input type="radio" id="wednesday" name="day" value="Wednesday">
  <label for="wednesday" style="display:inline;">Wednesday</label><br>

  <input type="radio" id="thursday" name="day" value="Thursday">
  <label for="thursday" style="display:inline;">Thursday</label><br>

  <input type="radio" id="friday" name="day" value="Friday">
  <label for="friday" style="display:inline;">Friday</label><br>

  <input type="radio" id="saturday" name="day" value="Saturday">
  <label for="saturday" style="display:inline;">Saturday</label><br>

  <input type="radio" id="sunday" name="day" value="Sunday">
  <label for="sunday" style="display:inline;">Sunday</label><br>

  <label for="social">Favorite Social Networking Site:</label>
  <select id="social" name="social">
    <option>Instagram</option>
    <option>TikTok</option>
    <option>Snapchat</option>
    <option>Facebook</option>
    <option>X</option>
  </select>

  <fieldset>
    <legend>Shipping Address</legend>

    <label for="address1">Addressline1:</label>
    <input type="text" id="address1" name="address1">

    <label for="address2">Addressline2:</label>
    <input type="text" id="address2" name="address2">

    <label for="city">City:</label>
    <input type="text" id="city" name="city">

    <label for="state">State:</label>
    <input type="text" id="state" name="state">

    <label for="zip">Zip:</label>
    <input type="text" id="zip" name="zip">
  </fieldset>

  <label for="password">Password:</label>
  <input type="password" id="password" name="password">

  <input type="image" src="signup.gif" alt="Sign Up" width="120" height="60">
</form>

</body>
</html>
