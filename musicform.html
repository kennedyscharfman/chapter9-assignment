<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Survey</title>

<style>
body {
  font-family: Arial, sans-serif;
}

form {
  background-color: #EAEAEA;
  width: 30em;
  padding: 1.5em;
  margin: 0 auto;
}

label {
  display: block;
  margin-top: 0.75em;
}

fieldset {
  margin-top: 1em;
  width: 26em;
}

h1 {
  text-align: center;
}

footer {
  text-align: center;
  margin-top: 1em;
}
</style>

</head>

<body>

<h1>Music Survey</h1>

<form>

<label for="name">Name:</label>
<input type="text" id="name" name="name">

<label for="email">E-mail:</label>
<input type="text" id="email" name="email">

<fieldset>
<legend>Select Your Favorite Types of Music:</legend>
<input type="checkbox"> Pop<br>
<input type="checkbox"> Classical<br>
<input type="checkbox"> Rock<br>
<input type="checkbox"> Folk<br>
<input type="checkbox"> Rap<br>
<input type="checkbox"> Other
</fieldset>

<fieldset>
<legend>Select how often you purchase Music:</legend>
<input type="radio" name="purchase"> Weekly<br>
<input type="radio" name="purchase"> A few CDs each year<br>
<input type="radio" name="purchase"> Monthly<br>
<input type="radio" name="purchase"> Never purchase
</fieldset>

<label for="location">Select the locations you listen to Music:</label>
<select id="location" name="location" multiple>
  <option>At home</option>
  <option>In the car</option>
  <option>Anywhere</option>
</select>

<label for="date">Choose the date you listen to music:</label>
<input type="date" id="date">

<label for="comments">What role does music play in your life?</label>
<textarea id="comments" rows="3" cols="40"></textarea>

<br><br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

<footer>
<p>Kennedy Scharfman</p>
<p>kmscharfman1@mail.lipscomb.edu</p>
</footer>

</body>
</html>
